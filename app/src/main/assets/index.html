<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1E404F">
  <meta name="description" content="ASTRA — ton thème astral, expliqué simplement.">
  <meta name="color-scheme" content="light dark">
  <script src="theme-bootstrap.js"></script>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <!-- Compiled from scripts/css-sources.mjs; built by npm run bundle. -->
  <link rel="stylesheet" href="astra.bundle.css">
  <title>ASTRA · Ton atlas céleste</title>
</head>
<body>
  <div class="app-shell">
    <header class="top">
      <div class="identity">
        <div class="emblem" aria-hidden="true">✳</div>
        <div><div class="brand">ASTRA</div><div class="brand-sub">Ton atlas céleste</div></div>
      </div>
      <button type="button" id="settingsButton" class="astra-settings-trigger" aria-label="Ouvrir les paramètres" aria-haspopup="dialog" aria-controls="astraSettingsDialog" title="Paramètres">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-1.9 1.9-.06-.06A1.7 1.7 0 0 0 16 18.43a1.7 1.7 0 0 0-1 .97V21h-2v-1.6a1.7 1.7 0 0 0-1-.97 1.7 1.7 0 0 0-1.85.34l-.06.06-1.9-1.9.06-.06A1.7 1.7 0 0 0 8.6 15 1.7 1.7 0 0 0 7.6 14H6v-2h1.6a1.7 1.7 0 0 0 1-.99 1.7 1.7 0 0 0-.34-1.85L8.2 9.1l1.9-1.9.06.06a1.7 1.7 0 0 0 1.85.34 1.7 1.7 0 0 0 .99-1V5h2v1.6a1.7 1.7 0 0 0 1 .99 1.7 1.7 0 0 0 1.85-.34l.06-.06 1.9 1.9-.06.06A1.7 1.7 0 0 0 19.4 11a1.7 1.7 0 0 0 1 .99H22v2h-1.6a1.7 1.7 0 0 0-1 .99Z" transform="translate(-1 -1)"/></svg>
      </button>
    </header>
    <main id="app" class="main"></main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <button type="button" class="nav active" data-tab="today" aria-label="Ce jour">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></span>
        <span class="nav-label">Ce jour</span>
      </button>
      <button type="button" class="nav" data-tab="month" aria-label="Ce mois">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18M8 14h2m4 0h2M8 18h2m4 0h2"/></svg></span>
        <span class="nav-label">Ce mois</span>
      </button>
      <button type="button" class="nav" data-tab="calendar" aria-label="Calendrier">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 2v4m10-4v4M3 9h18M8 13h2m4 0h2m-8 4h2m4 0h2"/></svg></span>
        <span class="nav-label">Calendrier</span>
      </button>
      <button type="button" class="nav" data-tab="profile" aria-label="Mon ciel">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z"/></svg></span>
        <span class="nav-label">Mon ciel</span>
      </button>
    </nav>
  </div>
  <dialog id="astraSettingsDialog" class="astra-settings-dialog" aria-labelledby="astraSettingsTitle"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="runtime.bundle.js"></script><script src="app.js" defer></script>
</body>
</html>
