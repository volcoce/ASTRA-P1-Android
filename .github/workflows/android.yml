name: ASTRA Public — Calcul dynamique Android 17
on:
  push:
    branches: [public-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer SDK Android 17
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Installer le moteur astronomique et construire le bundle hors ligne
        run: |
          npm install --no-audit --no-fund
          npm run bundle
          test -s app/src/main/assets/runtime.bundle.js
      - name: Tester le calcul dynamique (profil non préchargé)
        run: |
          npm test
          node --check app/src/main/assets/app.js
          if grep -R -E 'ASTRA_FORECASTS|p1-data.js|data.js.gz|PRESET=' app/src/main/assets astro; then
            echo 'Le produit public ne doit pas inclure les données précalculées historiques.'
            exit 1
          fi
      - name: Build Android 17 et lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Publier APK expérimental
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-PUBLIC-debug-Android17
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
