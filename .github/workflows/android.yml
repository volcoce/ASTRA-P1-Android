name: ASTRA · Android Preview CI
on:
  push:
    branches: [main, public-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer SDK Android 17
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Installer le moteur astronomique et construire le bundle hors ligne
        run: |
          npm install --no-audit --no-fund
          npm run bundle
          test -s app/src/main/assets/runtime.bundle.js
          test -s app/src/main/assets/astra.bundle.css
      - name: Tester le calcul dynamique (profil non préchargé)
        run: |
          npm run lint:css
          npm test
          node --check app/src/main/assets/app.js
          if grep -R -E 'ASTRA_FORECASTS|p1-data.js|data.js.gz|PRESET=' app/src/main/assets astro; then
            echo 'Le produit public ne doit pas inclure les données précalculées historiques.'
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Préparer les tests navigateur avec Chrome du runner
        run: |
          python -m pip install playwright==1.56.0
          command -v google-chrome || command -v chromium
      - name: Tester Mon ciel, les modes et le journal dans Chromium
        env:
          ASTRA_SCREENSHOT_DIR: tests/artifacts/screenshots
        run: python tests/ui-smoke.py
      - name: Publier les captures UI synthétiques
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-UI-regression-screenshots
          path: tests/artifacts/screenshots/*.png
          if-no-files-found: warn
      - name: Préparer la signature de test ASTRA Preview
        run: |
          base64 --decode ci/astra-preview-test-signing.p12.b64 > ci/astra-preview-test-signing.p12
          test -s ci/astra-preview-test-signing.p12
          keytool -list -storetype PKCS12 -keystore ci/astra-preview-test-signing.p12 -storepass 'astra-preview-TEST-only-2026' >/dev/null
      - name: Build Android 17 et lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Publier APK expérimental
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-PREVIEW-debug-Android17-stable-signature
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
